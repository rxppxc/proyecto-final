<div class="card h-100 shadow-sm product-card">
<div class="card product-card h-100">
  <img src="https://placehold.co/400x220/1a237e/ffa726?text={{ producto.nombre|urlencode }}&font=roboto"
       class="card-img-top" alt="{{ producto.nombre }}">
  <div class="card-body d-flex flex-column">
    {% if producto.categoria %}
    <span class="badge bg-primary align-self-start mb-2">{{ producto.categoria.nombre }}</span>
    {% endif %}
    <h6 class="card-title fw-bold">{{ producto.nombre }}</h6>
    <p class="card-text text-secondary-custom fw-bold fs-4 mb-2">${{ producto.precio }}</p>
    <div class="mb-2">
      {% if producto.stock == 0 %}
        <span class="badge bg-secondary"><i class="bi bi-x-circle me-1"></i>Sin stock</span>
      {% elif producto.stock < producto.stock_minimo %}
        <span class="badge badge-stock-bajo"><i class="bi bi-exclamation-triangle me-1"></i>Stock bajo</span>
      {% else %}
        <span class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Disponible</span>
      {% endif %}
    </div>
    <div class="mt-auto">
      <a href="/productos/{{ producto.id }}/" class="btn btn-primary btn-sm w-100">
        <i class="bi bi-eye me-1"></i>Ver detalle
      </a>
    </div>
  </div>
</div>
