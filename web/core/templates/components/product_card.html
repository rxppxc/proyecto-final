<div class="card h-100 shadow-sm product-card">
    <img src="https://placehold.co/600x400?text={{ producto.nombre|default:'Producto' }}" class="card-img-top" alt="{{ producto.nombre }}">
    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start gap-2">
            <h5 class="card-title">{{ producto.nombre }}</h5>
            <span class="badge bg-primary">{{ producto.categoria_id }}</span>
        </div>
        <p class="card-text text-muted">{{ producto.descripcion|truncatechars:90 }}</p>
        <div class="mt-auto">
            <p class="fw-bold text-primary mb-2">${{ producto.precio }}</p>
            {% if producto.stock == 0 %}
                <span class="badge bg-secondary mb-2">Sin stock</span>
            {% elif producto.stock < producto.stock_minimo %}
                <span class="badge bg-danger mb-2">Stock bajo</span>
            {% endif %}
            <a href="{% url 'product_detail' producto.id %}" class="btn btn-outline-primary w-100">Ver detalle</a>
        </div>
    </div>
</div>
